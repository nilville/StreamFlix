<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Discover trending movies and series with StreamFlix. Explore the latest in entertainment with trailers and detailed insights."
    />
    <meta
      name="keywords"
      content="movies, series, streaming, trailers, entertainment, StreamFlix"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="{{ url_for('static', filename='images/favicon-512.png') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <meta name="theme-color" content="#080A0F" />
    <title>
      {% block title %}StreamFlix — Discover Movies & Series{% endblock %}
    </title>
  </head>
  <body>
    <header
      class="site-header"
      style="
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      "
    >
      <div
        class="max-w-7xl mx-auto px-4 sm:px-6 py-3 sm:py-4 flex items-center justify-between relative"
      >
        <a
          href="/"
          class="flex items-center gap-2 sm:gap-3"
          style="text-decoration: none"
        >
          <span class="logo-text text-2xl sm:text-3xl tracking-tight"
            >StreamFlix</span
          >
          <span class="logo-dot"></span>
        </a>
        <nav class="hidden md:flex items-center gap-8">
          <a
            href="/"
            class="nav-link {% if request.path == '/' or request.path == '/all_movies' %}active{% endif %}"
            >Movies</a
          >
          <a
            href="/series"
            class="nav-link {% if request.path == '/series' or request.path == '/all_series' %}active{% endif %}"
            >Series</a
          >
        </nav>
        <div class="flex items-center gap-2 sm:gap-4">
          <form
            action="/search"
            method="GET"
            class="hidden md:flex relative items-center"
          >
            <input
              type="text"
              name="q"
              placeholder="Search..."
              class="bg-[var(--bg-glass)] border border-[var(--border-glass)] text-white text-sm rounded-full py-1.5 pl-4 pr-10 focus:outline-none focus:ring-2 focus:ring-indigo-500 w-32 sm:w-48 transition-all duration-300 focus:w-48 sm:focus:w-64"
              value="{{ query if query else '' }}"
            />
            <button
              type="submit"
              class="absolute right-0 top-0 bottom-0 text-gray-500 p-2.5 touch-manipulation"
              aria-label="Search"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-4 h-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2.5"
              >
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.3-4.3" />
              </svg>
            </button>
          </form>
          <div
            class="w-8 h-8 rounded-full bg-gradient-to-br from-indigo-500 to-purple-700 ring-2 ring-white/10 cursor-pointer touch-manipulation"
          ></div>
        </div>
      </div>
    </header>

    <main
      class="relative max-w-7xl mx-auto px-4 sm:px-6 pb-16 sm:pb-24 pt-8 sm:pt-14 main-content"
    >
      <div class="hero-glow"></div>
      {% block content %}{% endblock %}
    </main>

    <nav class="bottom-nav">
      <div class="bottom-nav-inner">
        <a
          href="/"
          class="bottom-nav-link {% if request.path == '/' or request.path == '/all_movies' %}active{% endif %}"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"
            />
          </svg>
          <span>Movies</span>
        </a>
        <a
          href="/series"
          class="bottom-nav-link {% if request.path == '/series' or request.path == '/all_series' %}active{% endif %}"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 10l4.553-2.07A1 1 0 0121 8.87v6.26a1 1 0 01-1.447.9L15 14M4 8a2 2 0 00-2 2v4a2 2 0 002 2h8a2 2 0 002-2v-4a2 2 0 00-2-2H4z"
            />
          </svg>
          <span>Series</span>
        </a>
        <a
          href="/search"
          class="bottom-nav-link {% if request.path == '/search' %}active{% endif %}"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            />
          </svg>
          <span>Search</span>
        </a>
      </div>
    </nav>

    <div
      id="detail-modal"
      class="detail-modal-overlay fixed inset-0 z-[200] flex items-center justify-center p-2 sm:p-4"
      style="
        background: rgba(0, 0, 0, 0.75);
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      "
    >
      <div
        class="detail-modal-box relative rounded-2xl max-w-5xl w-full max-h-[90vh] overflow-hidden"
      >
        <button
          type="button"
          class="modal-close-btn absolute top-5 right-5 z-20 w-11 h-11 flex items-center justify-center rounded-xl touch-manipulation"
          aria-label="Close"
          style="top: max(0.75rem, env(safe-area-inset-top))"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
        <div class="overflow-y-auto overflow-x-hidden max-h-[90vh] min-h-0">
          <div
            class="flex flex-col md:flex-row gap-5 sm:gap-6 md:gap-8 p-4 sm:p-6 md:p-10"
          >
            <div
              class="flex-shrink-0 w-full md:w-80 lg:w-96 max-w-[240px] sm:max-w-none mx-auto md:mx-0"
            >
              <div class="modal-poster-wrap">
                <img
                  id="modal-poster"
                  src=""
                  alt=""
                  class="w-full h-full object-cover"
                />
              </div>
            </div>
            <div class="flex-1 min-w-0 w-full">
              <h1
                id="modal-title"
                class="font-display font-extrabold text-2xl sm:text-3xl md:text-5xl text-white leading-tight mb-3 sm:mb-4 break-all sm:break-words"
              ></h1>
              <div
                class="flex items-center gap-2 sm:gap-3 mb-4 sm:mb-5 flex-wrap"
              >
                <div
                  class="modal-rating-badge flex items-center gap-2 px-3 sm:px-4 py-2 sm:py-2.5 rounded-lg"
                >
                  <svg
                    class="w-3.5 h-3.5 text-[var(--accent-warm)]"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M12 2l2.4 7.2H22l-6.2 4.5 2.4 7.3L12 16.5l-6.2 4.5 2.4-7.3L2 9.2h7.6z"
                    />
                  </svg>
                  <span
                    id="modal-rating"
                    class="text-[var(--accent-warm)]"
                  ></span>
                </div>
                <span
                  id="modal-date"
                  class="text-xs sm:text-sm text-[var(--text-muted)] px-2.5 py-1.5 bg-[var(--bg-glass)] border border-[var(--border-glass)] rounded-lg"
                ></span>
                <span
                  id="modal-seasons"
                  class="hidden font-mono text-xs sm:text-sm text-[var(--accent-teal)] px-2.5 py-1.5 bg-[var(--bg-glass)] border border-[var(--border-glass)] rounded-lg"
                ></span>
              </div>
              <div class="h-px bg-[var(--border-glass)] mb-4 sm:mb-5"></div>
              <div>
                <h3
                  class="font-mono text-[10px] sm:text-xs text-[var(--accent)] uppercase tracking-[0.2em] mb-2 sm:mb-3"
                >
                  Synopsis
                </h3>
                <p
                  id="modal-overview"
                  class="text-[var(--text-primary)] leading-relaxed text-sm sm:text-[0.95rem] break-words"
                ></p>
              </div>
              <div
                class="h-px bg-[var(--border-glass)] mt-4 sm:mt-5 mb-4 sm:mb-5"
              ></div>
              <button
                id="trailer-btn"
                type="button"
                class="trailer-btn"
                data-state="idle"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="w-5 h-5"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                >
                  <path d="M8 5v14l11-7z" />
                </svg>
                Watch Trailer
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Video Trailer Modal -->
    <div
      id="trailer-modal"
      class="detail-modal-overlay fixed inset-0 z-[300] flex items-center justify-center p-0 sm:p-4"
      style="background: rgba(0, 0, 0, 0.9)"
    >
      <button
        type="button"
        id="close-trailer-modal"
        class="absolute top-6 right-6 z-[310] w-12 h-12 flex items-center justify-center rounded-full bg-black/40 text-white border border-white/20 backdrop-blur-xl"
      >
        <svg
          class="w-6 h-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
      <div
        class="relative w-full max-w-6xl aspect-video bg-black shadow-2xl overflow-hidden sm:rounded-2xl border border-white/10"
      >
        <div id="trailer-video-container" class="w-full h-full">
          <!-- YouTube iframe will be injected here -->
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
  </body>
</html>
